<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ニイニイゼミ 採取マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#edf0ea;--ink:#26221f;--mute:#6c6b64;--line:#c8ccc0;--acc:#7a4a2b;--blue:#2a6f8f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:350px 1fr}
aside{overflow:auto;padding:18px 18px 28px;border-right:1px solid var(--line)}
#map{height:100%;min-height:320px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:.02em}
h2{font-size:14px;margin:22px 0 8px}
.mute{color:var(--mute);font-size:12px;margin:6px 0}
#status{font-weight:700;color:var(--acc);margin:4px 0 12px}
button,.btn,select{font:inherit;color:var(--ink)}
button,.btn{display:inline-block;padding:6px 12px;border:1px solid var(--ink);background:#fff;border-radius:4px;cursor:pointer}
button:hover,.btn:hover{background:var(--ink);color:#fff}
button:disabled{opacity:.4;pointer-events:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
select,input[type=text]{width:100%;font:inherit;padding:4px;border:1px solid var(--line);background:#fff;border-radius:4px}
label{display:block;margin:6px 0}
details{margin:12px 0;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:4px}
summary{cursor:pointer;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk label{display:inline-block;margin-right:14px}
#chartbox{height:210px}
.r{display:grid;grid-template-columns:1fr 90px 42px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.r i{height:8px;background:linear-gradient(90deg,var(--c,#c0562f) var(--w),#dde0d6 var(--w));border-radius:4px}
.r b{text-align:right}
.legend{background:rgba(255,255,255,.93);padding:8px 10px;border-radius:4px;font-size:12px;line-height:1.5;max-width:200px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.legend .bar{height:8px;width:150px;border-radius:4px;background:linear-gradient(90deg,#3b4a8c,#2a9d8f,#f2c14e)}
.legend span{display:inline-block;width:75px}.legend span+span{text-align:right}
.pop table{border-collapse:collapse;margin-top:4px}.pop td{padding:1px 8px 1px 0;font-size:12px}
@media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}#map{order:-1;height:55vh}aside{border-right:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside>
  <h1>ニイニイゼミ採取マップ</h1>
  <p class="mute">採取場所と環境データを地図に重ねて、偏りや関係を探します。</p>
  <div id="status">データを読み込んでいます…</div>
  <label class="btn">CSVを選ぶ<input type="file" id="file" accept=".csv,text/csv" hidden></label>
  <button id="geo">住所を緯度経度に変換</button>
  <details id="mapdet"><summary>列の対応づけ</summary><div id="maps"></div><label>地域名(住所の前に補う)<input type="text" id="region" value="大分県日田市"></label>
    <p class="mute">緯度・経度の列があれば住所は不要です。住所だけの場合は上のボタンで変換します(国土地理院の住所検索を使用)。</p></details>

  <h2>期間</h2>
  <div class="row"><select id="d0" aria-label="開始日"></select><select id="d1" aria-label="終了日"></select></div>

  <h2>表示</h2>
  <div class="chk"><label><input type="checkbox" id="sh" checked> 採取数ヒートマップ</label><label><input type="checkbox" id="sp" checked> 地点</label></div>
  <label>地点の色(円の大きさは採取数)<select id="metric"></select></label>

  <h2>日ごとの採取数と指標</h2>
  <div id="chartbox"><canvas id="chart"></canvas></div>
  <div id="cor"></div>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FIELDS=[['lat','緯度',/緯度|lat/i],['lon','経度',/経度|lon|lng/i],['addr','住所',/住所|場所|地点|採[取集]地|address/i],['date','採取日',/日付|日|date/i],['cnt','採取数(空欄なら1行=1個体)',/採[取集]数|個体数|count/i]];
const PAL=['#c0562f','#2a7f9e','#6a8f3a','#8e5ea2','#d4a017','#555'];
const ST=['#3b4a8c','#2a9d8f','#f2c14e'].map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)));
const ramp=t=>{t=Math.max(0,Math.min(1,t))*(ST.length-1);const i=Math.min(Math.floor(t),ST.length-2),f=t-i;return 'rgb('+ST[i].map((v,j)=>Math.round(v+(ST[i+1][j]-v)*f)).join()+')'};
let rows=[],cols=[],locs=[],chart=null,first=true,heat=null;
const cache=JSON.parse(localStorage.getItem('geo')||'{}');

const map=L.map('map').setView([33.32,130.93],11);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>',maxZoom:18}).addTo(map);
const ptl=L.layerGroup().addTo(map);
const lgc=L.control({position:'bottomright'});lgc.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.id='legend';d.hidden=true;return d};lgc.addTo(map);

$('#maps').innerHTML=FIELDS.map(([k,l])=>`<label>${l}<select id="c_${k}"></select></label>`).join('');
const status=t=>$('#status').textContent=t;
const sel=k=>$('#c_'+k).value;
const isNum=v=>/^\s*-?\d+(\.\d+)?\s*$/.test(v??'');
const isNumCol=c=>{const v=rows.map(r=>r[c]).filter(x=>x!==''&&x!=null);return v.length>=3&&v.filter(isNum).length/v.length>=.8};
const used=()=>FIELDS.map(([k])=>sel(k));
function dkey(v){v=String(v||'').trim();let m=v.match(/(\d{1,2})月(\d{1,2})日/);if(m)return+m[1]*100+ +m[2];m=v.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m)return+m[1]*10000+ +m[2]*100+ +m[3];m=v.match(/^(\d{1,2})[\/-](\d{1,2})$/);return m?+m[1]*100+ +m[2]:null}
const dl=k=>k<10000?`${k/100|0}/${k%100}`:`${k/10000|0}/${(k/100|0)%100}/${k%100}`;
function summ(rs,c,num){const v=rs.map(r=>r[c]).filter(x=>x!==''&&x!=null);if(num){const n=v.filter(isNum).map(parseFloat);return n.length?n.reduce((a,b)=>a+b,0)/n.length:null}
  const cnt={};v.forEach(x=>{x=String(x).trim();cnt[x]=(cnt[x]||0)+1});const e=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);return e.length?e[0][0]:null}
const pearson=(x,y)=>{const n=x.length,mx=x.reduce((a,b)=>a+b)/n,my=y.reduce((a,b)=>a+b)/n;let s=0,a=0,b=0;for(let i=0;i<n;i++){s+=(x[i]-mx)*(y[i]-my);a+=(x[i]-mx)**2;b+=(y[i]-my)**2}return s/Math.sqrt(a*b)};

function decode(buf){let t=new TextDecoder('utf-8').decode(buf);if(t.includes('\ufffd'))t=new TextDecoder('shift_jis').decode(buf);return t.replace(/^\ufeff/,'')}
function ingest(text){
  const r=Papa.parse(text,{header:true,skipEmptyLines:true});rows=r.data;cols=r.meta.fields.filter(c=>c&&!/^Unnamed/.test(c));
  FIELDS.forEach(([k,,re])=>{const s=$('#c_'+k);s.innerHTML='<option value="">(なし)</option>'+cols.map(c=>`<option>${esc(c)}</option>`).join('');s.value=cols.find(c=>re.test(c))||''});
  first=true;refreshDate();refreshMetric();
  $('#mapdet').open=!((sel('lat')&&sel('lon'))||sel('addr'));
  render();if(!(sel('lat')&&sel('lon')))geocode();
}
function refreshDate(){const dc=sel('date');const ks=dc?[...new Set(rows.map(r=>dkey(r[dc])).filter(k=>k!=null))].sort((a,b)=>a-b):[];
  $('#d0').innerHTML=$('#d1').innerHTML=ks.map(k=>`<option value="${k}">${dl(k)}</option>`).join('');if(ks.length){$('#d0').value=ks[0];$('#d1').value=ks[ks.length-1]}}
function refreshMetric(){const cs=cols.filter(c=>!used().includes(c)),old=$('#metric').value;
  $('#metric').innerHTML='<option value="">(色分けなし)</option>'+cs.map(c=>`<option>${esc(c)}</option>`).join('');$('#metric').value=cs.includes(old)?old:(cs.find(isNumCol)||'')}
const region=()=>$('#region').value.trim();
function fullQ(a){a=(a||'').trim();const R=region(),base=R.replace(/^大分県/,'');if(!a)return R;if(a.startsWith('大分県'))return a;if(base&&a.startsWith(base))return'大分県'+a;return R+a}
function loc(r){const la=sel('lat'),lo=sel('lon');
  if(la&&lo){const y=parseFloat(r[la]),x=parseFloat(r[lo]);if(!isNaN(y)&&!isNaN(x))return[y,x]}
  const a=sel('addr'),q=fullQ(a?r[a]:''),g=q&&cache[q];if(!g)return null;const p=[g[1],g[0]];if(q===region())p.city=true;return p}

async function geocode(){
  const a=sel('addr');const list=[...new Set(rows.map(r=>fullQ(a?r[a]:'')).filter(Boolean))];let i=0,ng=0;$('#geo').disabled=true;
  for(const q of list){i++;
    if(!(q in cache)){try{const j=await(await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q))).json();cache[q]=j[0]?j[0].geometry.coordinates:null}catch{cache[q]=null}
      localStorage.setItem('geo',JSON.stringify(cache));await new Promise(r=>setTimeout(r,150))}
    if(!cache[q])ng++;status(`住所を変換中 ${i}/${list.length}`)}
  $('#geo').disabled=false;render();if(ng)status($('#status').textContent+`(変換できない住所 ${ng}件)`)}

function render(){
  const dc=sel('date'),cc=sel('cnt'),k0=+$('#d0').value,k1=+$('#d1').value,m=$('#metric').value,num=!!m&&isNumCol(m);
  const g=new Map(),daily=new Map();let miss=0,tot=0,cityN=0;
  rows.forEach(r=>{const k=dc?dkey(r[dc]):null;if(k!=null&&(k<k0||k>k1))return;const p=loc(r);if(!p){miss++;return}
    if(p.city)cityN++;const n=cc?(parseFloat(r[cc])||0):1;tot+=n;const key=p.map(v=>v.toFixed(5)).join();
    let o=g.get(key);if(!o)g.set(key,o={p,n:0,rs:[],ks:new Set()});o.n+=n;o.rs.push(r);
    if(k!=null){o.ks.add(k);let d=daily.get(k);if(!d)daily.set(k,d={n:0,rs:[]});d.n+=n;d.rs.push(r)}});
  locs=[...g.values()];
  if(heat){map.removeLayer(heat);heat=null}ptl.clearLayers();
  if(!locs.length){status(rows.length?'位置を取得できていません。「住所を緯度経度に変換」を押すか、列の対応づけを確認してください':'CSVを選んでください');$('#legend').hidden=true;drawChart(daily,m,num);corr();return}
  status(`${locs.length}地点 / 採取数 ${tot}`+(cityN?` / 地点の記載がなく日田市の代表点に配置 ${cityN}行`:'')+(miss?` / 位置不明 ${miss}行`:''));
  locs.forEach(l=>l.v=m?summ(l.rs,m,num):null);
  let colorOf,lg='';
  if(m&&num){const vs=locs.map(l=>l.v).filter(v=>v!=null),a=Math.min(...vs),b=Math.max(...vs);colorOf=v=>v==null?'#999':ramp((v-a)/((b-a)||1));lg=`<b>${esc(m)}</b><div class="bar"></div><span>${a.toFixed(1)}</span><span>${b.toFixed(1)}</span>`}
  else if(m){const cs=[...new Set(locs.map(l=>l.v))];colorOf=v=>PAL[cs.indexOf(v)%PAL.length];lg=`<b>${esc(m)}</b>`+cs.map(c=>`<div><i style="background:${colorOf(c)}"></i>${esc(c??'(空欄)')}</div>`).join('')}
  else colorOf=()=>'#7a4a2b';
  const lgEl=$('#legend');lgEl.innerHTML=lg;lgEl.hidden=!lg;
  const mx=Math.max(...locs.map(l=>l.n))||1;
  heat=L.heatLayer(locs.map(l=>[l.p[0],l.p[1],l.n]),{radius:32,blur:24,max:mx,minOpacity:.3,gradient:{.2:'#fde9a8',.5:'#f4a259',.8:'#d1495b',1:'#5b1a2e'}});
  if($('#sh').checked)heat.addTo(map);
  if($('#sp').checked)locs.forEach(l=>{
    const rowsHtml=cols.filter(c=>!used().includes(c)).slice(0,12).map(c=>{const nc=isNumCol(c),v=summ(l.rs,c,nc);return v==null?'':`<tr><td>${esc(c)}</td><td>${nc?(+v).toFixed(1):esc(v)}</td></tr>`}).join('');
    const ds=[...l.ks].sort((a,b)=>a-b).map(dl).join(', ');
    L.circleMarker(l.p,{radius:5+3*Math.sqrt(l.n),fillColor:colorOf(l.v),color:'#26221f',weight:1,fillOpacity:.85})
      .bindPopup(`<div class="pop"><b>採取数 ${l.n}</b>${ds?`<br>採取日: ${esc(ds)}`:''}<table>${rowsHtml}</table></div>`).addTo(ptl)});
  if(first){map.fitBounds(locs.map(l=>l.p),{padding:[40,40],maxZoom:15});first=false}
  drawChart(daily,m,num);corr();
}
function drawChart(daily,m,num){
  const ks=[...daily.keys()].sort((a,b)=>a-b);if(chart)chart.destroy();
  const ds=[{type:'bar',label:'採取数',data:ks.map(k=>daily.get(k).n),backgroundColor:'#c98a5c',yAxisID:'y'}];
  if(m&&num)ds.push({type:'line',label:m+'(日平均)',data:ks.map(k=>summ(daily.get(k).rs,m,true)),borderColor:'#2a6f8f',backgroundColor:'#2a6f8f',yAxisID:'y1',tension:.25,spanGaps:true});
  chart=new Chart($('#chart'),{data:{labels:ks.map(dl),datasets:ds},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,title:{display:true,text:'採取数'}},y1:{position:'right',grid:{drawOnChartArea:false},display:!!(m&&num)}},plugins:{legend:{position:'bottom'}}}});
}
function corr(){
  const el=$('#cor');if(locs.length<5){el.innerHTML='<p class="mute">地点が5つ以上になると、採取数と各指標の相関を表示します。</p>';return}
  const out=[];cols.filter(c=>!used().includes(c)&&isNumCol(c)).forEach(c=>{const xs=[],ys=[];locs.forEach(l=>{const v=summ(l.rs,c,true);if(v!=null){xs.push(v);ys.push(l.n)}});if(xs.length>=5){const r=pearson(xs,ys);if(!isNaN(r))out.push([c,r])}});
  out.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  el.innerHTML='<h2>地点ごとの採取数との相関</h2>'+(out.slice(0,6).map(([c,r])=>`<div class="r"><span>${esc(c)}</span><i style="--w:${Math.abs(r)*100}%;${r<0?'--c:#2a6f8f':''}"></i><b>${r.toFixed(2)}</b></div>`).join('')||'<p class="mute">数値の列がありません。</p>')+'<p class="mute">赤は正、青は負の相関です。地点数が少ないうちは参考値で、因果を示すものではありません。</p>';
}

FIELDS.forEach(([k])=>$('#c_'+k).addEventListener('change',()=>{if(k==='date')refreshDate();refreshMetric();first=true;render()}));
['#d0','#d1','#metric','#sh','#sp'].forEach(s=>$(s).addEventListener('change',render));
$('#geo').addEventListener('click',geocode);
$('#region').addEventListener('change',()=>{first=true;geocode()});
$('#file').addEventListener('change',e=>e.target.files[0]&&e.target.files[0].arrayBuffer().then(b=>ingest(decode(b))));
fetch('data.csv').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>ingest(decode(b))).catch(()=>status('data.csv が見つかりません。CSVを選んでください'));
</script>
</body>
</html>
